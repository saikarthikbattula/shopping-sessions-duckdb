name: Validate integrated pipeline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.85.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install benchmark dependencies
        run: |
          make setup
          rustup toolchain install 1.85.0 --profile minimal
      - name: Build candidate and immutable pre-fix baseline
        run: |
          cargo build --release --locked --jobs 2 --manifest-path native/ingest/Cargo.toml
          mkdir -p "$RUNNER_TEMP/native-baseline"
          git archive f5f40eb6e1f19e4ecf7763eb4b07e36e555eff93 native/ingest | tar -x -C "$RUNNER_TEMP/native-baseline"
          cargo build --release --locked --jobs 2 --manifest-path "$RUNNER_TEMP/native-baseline/native/ingest/Cargo.toml"
          make generator
      - name: Alternating x86 comparisons on two sizes and seeds
        run: |
          set -eu
          lscpu
          for events in 1000000 5000000; do
            for seed in 1 2; do
              data=$(mktemp -d "$RUNNER_TEMP/benchmark-data.XXXXXX")
              tools/generator/target/release/generate --seed "$seed" --events "$events" --clicks "$((events / 4))" --output "$data"
              report="out-benchmark/linux-$events-$seed.json"
              .venv/bin/python scripts/benchmark_native.py "$RUNNER_TEMP/native-baseline/native/ingest/target/release/shopping-ingest" native/ingest/target/release/shopping-ingest "$data" "$report" --workers 2
              .venv/bin/python - "$report" <<'PY'
          import json, os, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          report = json.loads(path.read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'### {path.name}\nLinux x86 host, two workers; not scorer timing. Exact output comparisons passed.\n\n```json\n{json.dumps(report["summary"], indent=2)}\n```\n')
          PY
            done
          done
  correctness-and-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CPUS: '2'
      MEM: 2g
      NCPU: '2'
      MEM_GB: '2'
      RUSTUP_TOOLCHAIN: 1.85.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0 # Benchmark tests export the immutable submitted baseline.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned development dependencies
        run: make setup
      - name: Install Rust 1.85.0
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Native build, Rust tests and staging parity
        run: INGEST_BACKEND=python make test-native
      - name: Unit and differential tests
        run: INGEST_BACKEND=python REQUIRE_RUST_INGEST=1 make test
      - name: Rust raw-CSV analytical differential checks
        run: INGEST_BACKEND=rust REQUIRE_RUST_INGEST=1 .venv/bin/python -m unittest tests.test_integration -v
      - name: Build linux/amd64 image within the ten-minute build limit
        run: timeout 600s make build
      - name: Check image architecture and size
        run: |
          docker image inspect shopping-sessions:latest > /tmp/shopping-image.json
          python - <<'PY'
          import json
          from pathlib import Path
          image = json.loads(Path('/tmp/shopping-image.json').read_text())[0]
          assert image['Architecture'] == 'amd64', image['Architecture']
          assert image['Os'] == 'linux', image['Os']
          assert image['Size'] <= 8_000_000_000, image['Size']
          print('linux/amd64 image bytes:', image['Size'])
          PY
      - name: Both backends on official fixtures with scorer runtime restrictions
        run: |
          for backend in python rust; do
            INGEST_BACKEND="$backend" .venv/bin/python scripts/run_fixtures.py fixtures -- scripts/docker_run.sh
          done
      - name: Build official generator and create public seed-1 dev data
        run: make generator dev
      - name: Both backends match published public dev in restricted containers
        run: |
          for backend in python rust; do
            INGEST_BACKEND="$backend" scripts/docker_run.sh dev "out-$backend"
            .venv/bin/python scripts/check_dev_fingerprints.py "out-$backend"
          done
