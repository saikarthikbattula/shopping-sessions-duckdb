name: Evaluate imported Rust candidate
on:
  pull_request:
    paths:
      - 'native/express-lane/**'
      - 'scripts/benchmark_express_lane.py'
      - 'tests/native_support.py'
      - '.github/workflows/express-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  correctness-and-measurement:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check AVX-512 execution host
        run: |
          lscpu
          python3 - <<'PY'
          from pathlib import Path
          flags=Path('/proc/cpuinfo').read_text().split('flags',1)[1].split('\n',1)[0].split()
          required={'avx512f','avx512bw','avx512vl','avx512dq','avx512cd','avx512_vnni','avx2','bmi2','fma','f16c','popcnt','movbe','clflushopt','clwb'}
          missing=required-set(flags)
          if missing: raise SystemExit(f'Compatible execution host required; missing {sorted(missing)}')
          PY
      - name: Build trusted Rust and imported baseline
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup toolchain install 1.90.0 --profile minimal
          make setup native-ingest test-native generator
          cd native/express-lane
          cargo build --release --locked
          cargo test --release --locked
      - name: Official fixtures on imported candidate
        run: .venv/bin/python scripts/run_fixtures.py fixtures -- native/express-lane/target/release/pipeline
      - name: Independent differential and boundary checks
        env:
          RUST_INGEST_BIN: native/express-lane/target/release/pipeline
          NATIVE_CLI_STYLE: positional
          REQUIRE_RUST_INGEST: '1'
        run: .venv/bin/python -m unittest tests.test_analytics tests.test_integration tests.test_native_hot -v
      - name: Published dev comparison
        run: |
          make dev
          NCPU=2 native/express-lane/target/release/pipeline dev out-express-dev
          .venv/bin/python scripts/check_dev_fingerprints.py out-express-dev
      - name: Compare 5M and 20M on both seeds and sweep worker spin
        run: |
          set -eu
          workers=$(nproc)
          if [ "$workers" -gt 8 ]; then workers=8; fi
          for events in 5000000 20000000; do
            for seed in 1 2; do
              data=$(mktemp -d "$RUNNER_TEMP/express-data.XXXXXX")
              tools/generator/target/release/generate --seed "$seed" --events "$events" --clicks "$((events / 4))" --output "$data"
              .venv/bin/python scripts/benchmark_express_lane.py native/ingest/target/release/shopping-ingest native/express-lane/target/release/pipeline "$data" "out-express/$events-$seed.json" --workers "$workers"
              rm -rf "$data"
            done
          done
          .venv/bin/python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.benchmark_express_lane import recommend
          results={str(size):recommend([json.loads(Path(f'out-express/{size}-{seed}.json').read_text()) for seed in (1,2)]) for size in (5000000,20000000)}
          Path('out-express/recommendation.json').write_text(json.dumps(results,indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Candidate recommendations\nLinux CI host; not competition scorer timings.\n```json\n'+json.dumps(results,indent=2)+'\n```\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: express-candidate-measurements
          path: out-express/*.json
          if-no-files-found: ignore
