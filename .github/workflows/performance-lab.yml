name: One-off private performance lab
on:
  push:
    branches: [codex/performance-lab]
permissions:
  contents: read
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      BASELINE_COMMIT: cb70c668a91cbc720b4afe01cf1a8626804cf10b
      NCPU: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Record hardware and require compatible CPU
        id: hardware
        run: |
          mkdir -p out-lab
          lscpu > out-lab/lscpu.txt
          python3 - <<'PY'
          import json, os, platform
          from pathlib import Path
          info=Path('/proc/cpuinfo').read_text()
          flags=set(info.split('flags',1)[1].split('\n',1)[0].split())
          required={'avx512f','avx512bw','avx512vl','avx512dq','avx512cd','avx512_vnni','avx2','bmi2','fma','f16c','popcnt','movbe','clflushopt','clwb'}
          missing=sorted(required-flags)
          supported=not missing
          Path('out-lab/hardware.json').write_text(json.dumps({'platform':platform.platform(),'supported':supported,'missing':missing,'cpuinfo':info},indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write(f'supported={str(supported).lower()}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Hardware\n'+('Compatible AVX-512 host.\n' if supported else f'No execution or timing performed: CPU lacks {missing}.\n'))
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: steps.hardware.outputs.supported == 'true'
        with:
          python-version: '3.12'
      - name: Build and record production executable
        if: steps.hardware.outputs.supported == 'true'
        run: |
          set -eu
          docker build -t shopping-lab . > out-lab/docker-build.log 2>&1
          container=$(docker create shopping-lab)
          docker cp "$container:/pipeline" "$RUNNER_TEMP/baseline-pipeline"
          docker rm "$container"
          chmod +x "$RUNNER_TEMP/baseline-pipeline"
          docker image inspect shopping-lab > out-lab/image.json
          docker build --target build -t shopping-lab-builder . > out-lab/builder.log 2>&1
          docker run --rm --entrypoint rustc shopping-lab-builder --version --verbose > out-lab/compiler.txt
          file "$RUNNER_TEMP/baseline-pipeline" > out-lab/binary.txt
          sha256sum "$RUNNER_TEMP/baseline-pipeline" > out-lab/binary.sha256
          rustup toolchain install 1.95.0 --profile minimal
          rustup toolchain install 1.85.0 --profile minimal
          make setup generator
      - name: Baseline correctness before performance
        if: steps.hardware.outputs.supported == 'true'
        env:
          RUST_INGEST_BIN: ${{ runner.temp }}/baseline-pipeline
          NATIVE_CLI_STYLE: positional
          REQUIRE_RUST_INGEST: '1'
        run: |
          set -eu
          cargo test --release --locked > out-lab/unit-tests.log 2>&1
          .venv/bin/python scripts/run_fixtures.py fixtures -- "$RUST_INGEST_BIN" > out-lab/fixtures.log 2>&1
          .venv/bin/python -m unittest discover -s tests -v > out-lab/differential-tests.log 2>&1
          tools/generator/target/release/generate --seed 1 --events 1000000 --clicks 250000 --output "$RUNNER_TEMP/public-dev"
          "$RUST_INGEST_BIN" "$RUNNER_TEMP/public-dev" "$RUNNER_TEMP/public-out"
          .venv/bin/python scripts/check_dev_fingerprints.py "$RUNNER_TEMP/public-out" > out-lab/public-dev.log 2>&1
      - name: Measure four one-knob variants on both sizes and seeds
        if: steps.hardware.outputs.supported == 'true'
        run: |
          set -eu
          for events in 5000000 20000000; do
            for seed in 1 2; do
              data=$(mktemp -d "$RUNNER_TEMP/lab-data.XXXXXX")
              tools/generator/target/release/generate --seed "$seed" --events "$events" --clicks "$((events / 4))" --output "$data"
              .venv/bin/python scripts/performance_lab.py "$RUNNER_TEMP/baseline-pipeline" "$data" "out-lab/$events-$seed.json" --workers 2 --rounds 3 --case "$events-seed$seed"
              rm -rf "$data"
            done
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: performance-lab-${{ matrix.os }}
          path: out-lab/
          if-no-files-found: error
