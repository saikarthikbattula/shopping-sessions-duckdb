[package]
name = "shopping-ingest"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
arrow-array = "=56.2.0"
arrow-schema = "=56.2.0"
parquet = { version = "=56.2.0", default-features = false, features = ["arrow", "snap"] }
serde_json = "1.0"
memchr = "2.8"


[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
